<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crypto Cockpit">
  <title>Crypto Cockpit</title>

  <!-- Pastille pleine plutôt qu'un contour : à 16 px, un cercle fin et une
       courbe fine se confondent en une tache. Un aplat sombre traversé d'une
       courbe claire garde du contraste à toutes les tailles, et se détache
       aussi bien sur une barre d'onglets claire que sombre. -->
  <circle cx="32" cy="32" r="32" fill="#16181c"/>

  <!-- La courbe de cycle : montée, sommet, creux, reprise. -->
  <path fill="none" stroke="#f2f4f7" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"
        d="M 13 41 C 18 41, 20 22, 26 22 C 32 22, 34 44, 40 44 C 44 44, 46 33, 49 29"/>

  <!-- Position actuelle. Le disque sombre l'isole de la courbe pour que les
       deux restent distincts une fois réduits. -->
  <circle cx="49" cy="29" r="9" fill="#16181c"/>
  <circle cx="49" cy="29" r="6" fill="#ff8b4d"/>
</svg>
