<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 64" role="img" aria-label="Crypto Cockpit">
  <title>Crypto Cockpit</title>
  <style>
    /* Le nom suit le thème du système ; la pastille reste sombre pour rester
       lisible partout, y compris posée sur un fond clair. */
    .nom { fill: #1a1c1f; }
    @media (prefers-color-scheme: dark) { .nom { fill: #e8eaed; } }
  </style>

  <circle cx="32" cy="32" r="32" fill="#16181c"/>
  <path fill="none" stroke="#f2f4f7" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"
        d="M 13 41 C 18 41, 20 22, 26 22 C 32 22, 34 44, 40 44 C 44 44, 46 33, 49 29"/>
  <circle cx="49" cy="29" r="9" fill="#16181c"/>
  <circle cx="49" cy="29" r="6" fill="#ff8b4d"/>

  <text class="nom" x="80" y="42"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="29" font-weight="600" letter-spacing="-0.4">Crypto Cockpit</text>
</svg>
